name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Tauri app: the Rust side links against macOS frameworks.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
        continue-on-error: true
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test (TypeScript)
        run: pnpm run test
      - name: Build (TypeScript)
        run: pnpm run build
      # rust-toolchain.toml pins the toolchain; rustup on the runner installs it on first use.
      - name: Test (Rust)
        run: cargo test --workspace --locked
