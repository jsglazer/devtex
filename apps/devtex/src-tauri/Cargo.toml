[package]
name = "devtex"
description = "DevTex — a personal LaTeX editor with instant HTML preview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "devtex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-ios-bookmarks = { path = "../../../plugins/tauri-plugin-ios-bookmarks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify = "9"
notify-debouncer-mini = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3.27"
mockito = "1.7"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
